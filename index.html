<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Waste Detector</title>
<style>
  body { margin: 0; background: #111; }
  .box { position: relative; width: 100%; max-width: 480px; margin: 0 auto; aspect-ratio: 4 / 3; }
  video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
  #status { color: #fff; text-align: center; font-family: sans-serif; }
</style>
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.19.0/dist/ort.min.js"></script>
</head>
<body>
  <p id="status">Loading...</p>
  <div class="box">
    <video id="video" playsinline muted autoplay></video>
    <canvas id="overlay"></canvas>
  </div>

  <script>
    alert("script is running");

    const CLASS_NAMES = ["BIODEGRADABLE", "CARDBOARD", "GLASS", "METAL", "PAPER", "PLASTIC"];
    const INPUT_SIZE = 640;
    const CONF_THRESHOLD = 0.4;
    const IOU_THRESHOLD = 0.45;

    const video = document.getElementById("video");
    const overlay = document.getElementById("overlay");
    const ctx = overlay.getContext("2d");
    const statusEl = document.getElementById("status");
    let session;

    async function main() {
      console.log("1. requesting camera...");
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "environment" },
      });
      console.log("2. got camera stream");
      video.srcObject = stream;
      await video.play();
      console.log("3. video playing, size:", video.videoWidth, video.videoHeight);

      overlay.width = video.videoWidth;
      overlay.height = video.videoHeight;

      statusEl.textContent = "Loading model...";
      console.log("4. about to load model");

      session = await ort.InferenceSession.create("best.onnx", {
        executionProviders: ["wasm"],
      });
      console.log("5. model loaded");
      statusEl.textContent = "Running";

      requestAnimationFrame(detectLoop);
    }

    function letterbox(sourceVideo, size) {
      const off = document.createElement("canvas");
      off.width = size;
      off.height = size;
      const offCtx = off.getContext("2d");

      const scale = Math.min(size / sourceVideo.videoWidth, size / sourceVideo.videoHeight);
      const newW = sourceVideo.videoWidth * scale;
      const newH = sourceVideo.videoHeight * scale;
      const padX = (size - newW) / 2;
      const padY = (size - newH) / 2;

      offCtx.fillStyle = "#727272";
      offCtx.fillRect(0, 0, size, size);
      offCtx.drawImage(sourceVideo, padX, padY, newW, newH);

      return { canvas: off, scale, padX, padY };
    }

    function preprocess(letterboxCanvas) {
      const imgData = letterboxCanvas.getContext("2d").getImageData(0, 0, INPUT_SIZE, INPUT_SIZE).data;
      const area = INPUT_SIZE * INPUT_SIZE;
      const data = new Float32Array(3 * area);
      for (let i = 0; i < area; i++) {
        data[i] = imgData[i * 4] / 255;
        data[area + i] = imgData[i * 4 + 1] / 255;
        data[2 * area + i] = imgData[i * 4 + 2] / 255;
      }
      return new ort.Tensor("float32", data, [1, 3, INPUT_SIZE, INPUT_SIZE]);
    }

    function iou(a, b) {
      const x1 = Math.max(a.x1, b.x1), y1 = Math.max(a.y1, b.y1);
      const x2 = Math.min(a.x2, b.x2), y2 = Math.min(a.y2, b.y2);
      const inter = Math.max(0, x2 - x1) * Math.max(0, y2 - y1);
      const areaA = (a.x2 - a.x1) * (a.y2 - a.y1);
      const areaB = (b.x2 - b.x1) * (b.y2 - b.y1);
      return inter / (areaA + areaB - inter);
    }

    function nms(boxes) {
      boxes.sort((a, b) => b.score - a.score);
      const kept = [];
      for (const box of boxes) {
        if (kept.every((k) => iou(k, box) < IOU_THRESHOLD)) kept.push(box);
      }
      return kept;
    }

    function postprocess(output, meta) {
      const numClasses = CLASS_NAMES.length;
      const numBoxes = output.dims[2];
      const data = output.data;
      const boxes = [];

      for (let i = 0; i < numBoxes; i++) {
        let bestScore = 0, bestClass = -1;
        for (let c = 0; c < numClasses; c++) {
          const score = data[(4 + c) * numBoxes + i];
          if (score > bestScore) { bestScore = score; bestClass = c; }
        }
        if (bestScore < CONF_THRESHOLD) continue;

        const cx = data[0 * numBoxes + i];
        const cy = data[1 * numBoxes + i];
        const w = data[2 * numBoxes + i];
        const h = data[3 * numBoxes + i];

        const x1 = (cx - w / 2 - meta.padX) / meta.scale;
        const y1 = (cy - h / 2 - meta.padY) / meta.scale;
        const x2 = (cx + w / 2 - meta.padX) / meta.scale;
        const y2 = (cy + h / 2 - meta.padY) / meta.scale;

        boxes.push({ x1, y1, x2, y2, score: bestScore, classId: bestClass });
      }
      return nms(boxes);
    }

    function draw(boxes) {
      ctx.clearRect(0, 0, overlay.width, overlay.height);
      ctx.lineWidth = 3;
      ctx.font = "16px sans-serif";
      for (const b of boxes) {
        ctx.strokeStyle = "#6fd97f";
        ctx.strokeRect(b.x1, b.y1, b.x2 - b.x1, b.y2 - b.y1);
        const label = `${CLASS_NAMES[b.classId]} ${(b.score * 100).toFixed(0)}%`;
        const textW = ctx.measureText(label).width;
        ctx.fillStyle = "#6fd97f";
        ctx.fillRect(b.x1, Math.max(0, b.y1 - 20), textW + 8, 20);
        ctx.fillStyle = "#111";
        ctx.fillText(label, b.x1 + 4, Math.max(14, b.y1 - 5));
      }
    }

    async function detectLoop() {
      const meta = letterbox(video, INPUT_SIZE);
      const tensor = preprocess(meta.canvas);
      const results = await session.run({ images: tensor });
      const boxes = postprocess(results.output0, meta);
      draw(boxes);
      requestAnimationFrame(detectLoop);
    }

    main().catch((err) => {
      statusEl.textContent = "Error: " + err.message;
      console.error(err);
    });
  </script>
</body>
</html>
